services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: bookspace
      POSTGRES_USER: bookspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookspace_password}
    volumes:
      - bookspace_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookspace -d bookspace"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://bookspace:${POSTGRES_PASSWORD:-bookspace_password}@db:5432/bookspace
      SECRET_KEY: ${SECRET_KEY:-replace-this-secret-before-deployment}
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  bookspace_data:
